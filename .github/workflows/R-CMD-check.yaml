# Run the package checks used for release decisions on each major CRAN platform.
# The comparison vignette contains display-only bayesTLS code, so no Stan or
# cmdstanr installation is needed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # Coverage collection lives in test-coverage.yaml (ubuntu-only, one
    # Codecov upload). Do not add covr to this OS matrix: ubuntu-release,
    # ubuntu-devel, windows, and macos-15-intel run the same testthat suite
    # and extra uploads would double-count.

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: windows-latest, r: release}
          # `macos-latest` is currently ARM and its R 4.6 binary package
          # download can yield a non-archive response before checks start.
          # Keep the release check on GitHub's supported Intel macOS image.
          - {os: macos-15-intel, r: release}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # v2.14.0 includes setup-r-dependencies #1096 (classic sudo on
      # sudo-rs / Ubuntu 25.10+). v2.12.1 dropped R_LIB_FOR_PAK under
      # `sudo -E` on current ubuntu-latest. Matrix OS/R unchanged.
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          dependencies: 'c("hard", "soft")'
          extra-packages: |
            any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          upload-snapshots: true
